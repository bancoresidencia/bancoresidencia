name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Testes IRT/Segurança e Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🔍 Verificação de Código (ESLint)
        run: npm run lint

      - name: 🧬 Testes Unitários do Modelo Psicométrico (TRI/IRT)
        run: npm run test:irt

      - name: 🛡️ Testes de Segurança e Proteção Anti-Scraping
        run: npm run test:security

      - name: 🏗️ Validação de Compilação do Next.js (Build Check)
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://ezluharxlmlqhdkqrjbz.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_build_placeholder'
          SUPABASE_SECRET_KEY: 'sb_secret_ci_build_placeholder'
          GUEST_QUOTA_SECRET: 'ci-build-only-not-a-real-secret'
        run: npm run build
