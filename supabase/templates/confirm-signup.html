<!doctype html>
<html lang="pt-BR">
  <body style="margin: 0; padding: 24px; background: #f4f4f5; color: #18181b; font-family: Arial, sans-serif;">
    <div style="margin: 0 auto; max-width: 480px; padding: 24px; background: #ffffff; border-radius: 12px;">
      <p style="margin: 0 0 16px; font-weight: 700;">Banco Residência</p>
      <h1 style="margin: 0 0 12px; font-size: 24px;">Confirme seu e-mail</h1>
      <p style="margin: 0 0 20px; line-height: 1.5;">Confirme seu endereço para acessar sua conta.</p>
      <p style="margin: 0 0 20px;">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}" style="display: inline-block; padding: 12px 16px; border-radius: 8px; background: #1d4ed8; color: #ffffff; font-weight: 700; text-decoration: none;">Confirmar e-mail</a>
      </p>
      <p style="margin: 0; color: #52525b; font-size: 14px; line-height: 1.5;">Se você não solicitou o cadastro, ignore este e-mail.</p>
    </div>
  </body>
</html>
