<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirme seu e-mail | Hippocampus Residência</title>
  <style>
    @font-face { font-family:'Inter Display'; font-style:normal; font-weight:400; font-display:swap; src:url('https://rsms.me/inter/font-files/InterDisplay-Regular.woff2?v=4.1') format('woff2'); }
    @font-face { font-family:'Inter Display'; font-style:normal; font-weight:700; font-display:swap; src:url('https://rsms.me/inter/font-files/InterDisplay-Bold.woff2?v=4.1') format('woff2'); }
    @media only screen and (max-width:480px) {
      .email-frame { padding:24px 16px !important; }
      .email-content { padding:36px 24px 40px !important; }
      .email-title { font-size:32px !important; }
    }
  </style>
  <!--[if mso]><style>body, td, h1, p, a { font-family:Arial,sans-serif !important; }</style><![endif]-->
</head>
<body style="margin:0; padding:0; background:#eef3fb; color:#17243a; font-family:'Inter Display',Inter,'Segoe UI',Arial,sans-serif;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">Confirme seu endereço para acessar sua conta no Hippocampus Residência.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#eef3fb" style="font-family:'Inter Display',Inter,'Segoe UI',Arial,sans-serif;">
    <tr>
      <td class="email-frame" align="center" style="padding:52px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="max-width:560px; border:1px solid #d9e5f6; border-radius:24px; overflow:hidden;">
          <tr>
            <td class="email-content" align="center" style="padding:48px 48px 50px;">
              <img src="https://bancoresidencia-kappa.vercel.app/hippocampus-email.png" width="232" height="63" alt="Hippocampus Residência" style="display:block; width:232px; height:auto; max-width:100%; margin:0 auto; border:0; color:#17243a; font-weight:bold;">
              <h1 class="email-title" style="margin:30px 0 16px; color:#111e36; font-size:40px; font-weight:700; line-height:1.1; letter-spacing:-0.035em;">Confirme seu e-mail</h1>
              <p style="max-width:360px; margin:0 auto 32px; color:#475569; font-size:17px; line-height:1.65;">Bem-vindo ao <strong>Hippocampus Residência</strong>! Confirme seu endereço de e-mail para acessar sua conta.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" align="center">
                <tr><td align="center" bgcolor="#1d4ed8" style="border-radius:12px; mso-padding-alt:16px 32px;">
                  <a href='{{ if eq .SiteURL "http://127.0.0.1:3000" }}http://127.0.0.1:3000{{ else }}https://bancoresidencia-kappa.vercel.app{{ end }}/auth/confirm?token_hash={{ .TokenHash }}' style="display:inline-block; padding:16px 32px; color:#ffffff; font-family:'Inter Display',Inter,'Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.25; font-weight:700; text-decoration:none; border-radius:12px;">Confirmar meu e-mail</a>
                </td></tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" bgcolor="#f7faff" style="padding:24px; border-top:1px solid #e4ecf8;">
              <p style="max-width:350px; margin:0 auto; color:#526176; font-size:13px; line-height:1.6;">Se você não solicitou esse cadastro, pode ignorar este e-mail.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
